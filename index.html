<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="English Practice">
    <title>Interactive English Speaking App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            padding-bottom: 100px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 25px;
            color: white;
            padding-top: 20px;
        }
        
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .user-stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            color: white;
            font-size: 0.9em;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .level-indicator {
            background: rgba(255,255,255,0.25);
            padding: 12px;
            border-radius: 25px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }
        
        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .exercise-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        
        .exercise-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        
        .exercise-card.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .exercise-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
            opacity: 0;
        }
        
        .exercise-card:hover::before {
            animation: shimmer 0.8s ease-in-out;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); opacity: 0; }
        }
        
        .exercise-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }
        
        .exercise-title {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .exercise-count {
            font-size: 0.9em;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .practice-section {
            background: white;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: none;
        }
        
        .practice-section.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .phrase-display {
            font-size: 1.4em;
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #f8f9ff, #e8f4f8);
            border-radius: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            line-height: 1.6;
        }
        
        .pronunciation-guide {
            font-size: 1.1em;
            color: #666;
            text-align: center;
            margin-bottom: 15px;
            font-style: italic;
            font-family: 'Courier New', monospace;
        }
        
        .tips-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        
        .tips-section::before {
            content: '💡 ';
            font-weight: bold;
        }
        
        .control-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        
        .btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #495057;
            border: 2px solid #e9ecef;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            color: white;
        }
        
        .record-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            position: relative;
        }
        
        .record-button.recording {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }
        
        .wave-animation {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            margin: 20px 0;
        }
        
        .wave-bar {
            width: 6px;
            height: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 3px;
            border-radius: 3px;
            animation: wave 1.2s infinite ease-in-out;
        }
        
        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { animation-delay: 0.6s; }
        
        @keyframes wave {
            0%, 40%, 100% { transform: scaleY(0.4); }
            20% { transform: scaleY(1); }
        }
        
        .feedback {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1.1em;
            position: relative;
            overflow: hidden;
        }
        
        .feedback::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 2s infinite;
        }
        
        .feedback.success {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            border: 2px solid #b8daff;
        }
        
        .feedback.error {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .feedback.info {
            background: linear-gradient(135deg, #cce7ff, #99d6ff);
            color: #0066cc;
            border: 2px solid #66b3ff;
        }
        
        .progress-container {
            margin: 20px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.3);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            border-radius: 6px;
            transition: width 0.8s ease;
            position: relative;
        }
        
        .progress-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        
        .score-display {
            text-align: center;
            color: white;
            font-size: 1.3em;
            margin: 15px 0;
            font-weight: bold;
        }
        
        .hidden {
            display: none;
        }
        
        .achievement-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
            animation: popIn 0.5s ease-out;
        }
        
        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .achievement-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
        }
        
        .nav-item {
            text-align: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 15px;
            transition: all 0.3s ease;
            flex: 1;
            max-width: 80px;
        }
        
        .nav-item:hover {
            background: #f8f9fa;
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .nav-icon {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .nav-label {
            font-size: 0.8em;
            font-weight: 500;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .exercise-grid {
                grid-template-columns: 1fr;
            }
            
            .phrase-display {
                font-size: 1.2em;
                padding: 20px;
            }
            
            .control-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗣️ English Speaking</h1>
            <div class="user-stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalExercises">0</div>
                    <div>Exercises</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="avgScore">0</div>
                    <div>Avg Score</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="streak">0</div>
                    <div>Streak</div>
                </div>
            </div>
        </div>
        
        <div class="level-indicator">
            <span id="currentLevel">Beginner Level</span>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="levelProgress" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <div class="exercise-grid">
            <div class="exercise-card active" data-category="greetings">
                <span class="exercise-icon">👋</span>
                <div class="exercise-title">Greetings</div>
                <div class="exercise-count">3 exercises</div>
            </div>
            <div class="exercise-card" data-category="conversation">
                <span class="exercise-icon">💬</span>
                <div class="exercise-title">Conversation</div>
                <div class="exercise-count">3 exercises</div>
            </div>
            <div class="exercise-card" data-category="pronunciation">
                <span class="exercise-icon">🔊</span>
                <div class="exercise-title">Pronunciation</div>
                <div class="exercise-count">2 exercises</div>
            </div>
            <div class="exercise-card" data-category="vocabulary">
                <span class="exercise-icon">📚</span>
                <div class="exercise-title">Vocabulary</div>
                <div class="exercise-count">2 exercises</div>
            </div>
            <div class="exercise-card" data-category="advanced">
                <span class="exercise-icon">🎓</span>
                <div class="exercise-title">Advanced</div>
                <div class="exercise-count">2 exercises</div>
            </div>
            <div class="exercise-card" data-category="random">
                <span class="exercise-icon">🎲</span>
                <div class="exercise-title">Random</div>
                <div class="exercise-count">Surprise!</div>
            </div>
        </div>
        
        <div class="practice-section active" id="practiceSection">
            <div class="phrase-display" id="phraseDisplay">
                Select an exercise category to start practicing!
            </div>
            
            <div class="pronunciation-guide" id="pronunciationGuide"></div>
            
            <div class="tips-section" id="tipsSection" style="display: none;">
                <span id="tipsContent"></span>
            </div>
            
            <div class="control-buttons">
                <button class="btn btn-secondary" id="listenBtn">🔊 Listen</button>
                <button class="btn btn-secondary" id="slowBtn">🐌 Slow</button>
                <button class="btn btn-primary" id="hintBtn">💡 Hint</button>
            </div>
            
            <button class="btn btn-danger record-button" id="recordBtn">🎤</button>
            
            <div class="wave-animation hidden" id="waveAnimation">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
            
            <div class="feedback hidden" id="feedback"></div>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="exerciseProgress" style="width: 0%"></div>
                </div>
            </div>
            
            <div class="control-buttons">
                <button class="btn btn-success" id="nextBtn">Next ➡️</button>
                <button class="btn btn-secondary" id="repeatBtn">🔄 Repeat</button>
                <button class="btn btn-primary" id="skipBtn">Skip ⏭️</button>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav">
        <div class="nav-item active" data-tab="practice">
            <div class="nav-icon">🎯</div>
            <div class="nav-label">Practice</div>
        </div>
        <div class="nav-item" data-tab="progress">
            <div class="nav-icon">📊</div>
            <div class="nav-label">Progress</div>
        </div>
        <div class="nav-item" data-tab="settings">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">Settings</div>
        </div>
    </div>

    <script>
        // Exercise data
        const exercises = {
            greetings: [
                {
                    phrase: "Hello, how are you today?",
                    pronunciation: "/həˈloʊ, haʊ ɑr ju təˈdeɪ/",
                    tip: "Remember to stress 'how' and 'to-day'. The 'o' in 'how' should be pronounced like 'ow' in 'cow'."
                },
                {
                    phrase: "Good morning! Nice to meet you.",
                    pronunciation: "/ɡʊd ˈmɔrnɪŋ! naɪs tu mit ju/",
                    tip: "The 'oo' in 'good' is short, like in 'book'. 'Morning' has stress on the first syllable."
                },
                {
                    phrase: "Have a wonderful day!",
                    pronunciation: "/hæv ə ˈwʌndərfəl deɪ/",
                    tip: "The 'a' in 'have' sounds like the 'a' in 'cat'. 'Wonderful' has stress on the first syllable."
                }
            ],
            conversation: [
                {
                    phrase: "What do you do for work?",
                    pronunciation: "/wʌt du ju du fɔr wɜrk/",
                    tip: "The first 'do' is stressed. The 'or' in 'work' sounds like 'er'."
                },
                {
                    phrase: "I love spending time with my family.",
                    pronunciation: "/aɪ lʌv ˈspɛndɪŋ taɪm wɪð maɪ ˈfæməli/",
                    tip: "Connect 'spending time' smoothly. The 'th' in 'with' should be soft."
                },
                {
                    phrase: "Could you please help me?",
                    pronunciation: "/kʊd ju pliz hɛlp mi/",
                    tip: "The 'ou' in 'could' sounds like 'oo' in 'book'. 'Please' rhymes with 'cheese'."
                }
            ],
            pronunciation: [
                {
                    phrase: "The weather is wonderful today.",
                    pronunciation: "/ðə ˈwɛðər ɪz ˈwʌndərfəl təˈdeɪ/",
                    tip: "Focus on the 'th' sounds in 'the' and 'weather'. The first 'th' is soft, the second is voiced."
                },
                {
                    phrase: "She sells seashells by the seashore.",
                    pronunciation: "/ʃi sɛlz ˈsiʃɛlz baɪ ðə ˈsiʃɔr/",
                    tip: "This is a classic tongue twister. Focus on the 's' and 'sh' sounds - they're different!"
                }
            ],
            vocabulary: [
                {
                    phrase: "The magnificent sunset painted the sky orange.",
                    pronunciation: "/ðə mæɡˈnɪfəsənt ˈsʌnsɛt ˈpeɪntəd ðə skaɪ ˈɔrəndʒ/",
                    tip: "Break down 'magnificent' into syllables: mag-NI-fi-cent. The stress is on the second syllable."
                },
                {
                    phrase: "Technology has revolutionized our daily lives.",
                    pronunciation: "/tɛkˈnɑlədʒi hæz ˌrɛvəˈluʃəˌnaɪzd aʊr ˈdeɪli laɪvz/",
                    tip: "Tech-NO-lo-gy has stress on the second syllable. Re-vo-lu-tion-ized is a long word - take your time."
                }
            ],
            advanced: [
                {
                    phrase: "Nevertheless, the unprecedented circumstances required immediate action.",
                    pronunciation: "/ˌnɛvərðəˈlɛs, ði ʌnˈprɛsəˌdɛntəd ˈsɜrkəmˌstænsəz rɪˈkwaɪrd ɪˈmidiət ˈækʃən/",
                    tip: "This sentence has many syllables. Practice each word separately first, then combine them smoothly."
                },
                {
                    phrase: "The philosophical implications of artificial intelligence are profound.",
                    pronunciation: "/ðə ˌfɪləˈsɑfɪkəl ˌɪmpləˈkeɪʃənz ʌv ˌɑrtəˈfɪʃəl ɪnˈtɛlədʒəns ɑr prəˈfaʊnd/",
                    tip: "Pay attention to the stress patterns in long words like 'philosophical' and 'implications'."
                }
            ]
        };

        // App state
        let currentCategory = 'greetings';
        let currentExercise = 0;
        let isRecording = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let userStats = {
            totalExercises: 0,
            avgScore: 0,
            streak: 0,
            level: 1,
            experience: 0
        };

        // DOM elements
        const practiceSection = document.getElementById('practiceSection');
        const phraseDisplay = document.getElementById('phraseDisplay');
        const pronunciationGuide = document.getElementById('pronunciationGuide');
        const tipsSection = document.getElementById('tipsSection');
        const tipsContent = document.getElementById('tipsContent');
        const listenBtn = document.getElementById('listenBtn');
        const slowBtn = document.getElementById('slowBtn');
        const hintBtn = document.getElementById('hintBtn');
        const recordBtn = document.getElementById('recordBtn');
        const waveAnimation = document.getElementById('waveAnimation');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const skipBtn = document.getElementById('skipBtn');
        const exerciseProgress = document.getElementById('exerciseProgress');
        const levelProgress = document.getElementById('levelProgress');
        const currentLevel = document.getElementById('currentLevel');
        const totalExercises = document.getElementById('totalExercises');
        const avgScore = document.getElementById('avgScore');
        const streak = document.getElementById('streak');

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            initializeSpeechRecognition();
            loadUserStats();
            updateUI();
            attachEventListeners();
        });

        function initializeSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';
                
                recognition.onstart = function() {
                    console.log('Speech recognition started');
                    isRecording = true;
                    recordBtn.classList.add('recording');
                    waveAnimation.classList.remove('hidden');
                    showFeedback('Listening...', 'info');
                };
                
                recognition.onend = function() {
                    console.log('Speech recognition ended');
                    isRecording = false;
                    recordBtn.classList.remove('recording');
                    waveAnimation.classList.add('hidden');
                };
                
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    console.log('Recognized:', transcript);
                    evaluateSpeech(transcript);
                };
                
                recognition.onerror = function(event) {
                    console.error('Speech recognition error:', event.error);
                    showFeedback('Sorry, I couldn\'t hear you clearly. Please try again.', 'error');
                    isRecording = false;
                    recordBtn.classList.remove('recording');
                    waveAnimation.classList.add('hidden');
                };
            } else {
                console.log('Speech recognition not supported');
                showFeedback('Speech recognition is not supported in this browser.', 'error');
            }
        }

        function attachEventListeners() {
            // Exercise category selection
            document.querySelectorAll('.exercise-card').forEach(card => {
                card.addEventListener('click', function() {
                    const category = this.dataset.category;
                    selectCategory(category);
                });
            });

            // Control buttons
            listenBtn.addEventListener('click', playCurrentPhrase);
            slowBtn.addEventListener('click', playCurrentPhraseSlow);
            hintBtn.addEventListener('click', showHint);
            recordBtn.addEventListener('click', toggleRecording);
            nextBtn.addEventListener('click', nextExercise);
            repeatBtn.addEventListener('click', repeatExercise);
            skipBtn.addEventListener('click', skipExercise);

            // Bottom navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    const tab = this.dataset.tab;
                    switchTab(tab);
                });
            });
        }

        function selectCategory(category) {
            currentCategory = category;
            currentExercise = 0;
            
            // Update active card
            document.querySelectorAll('.exercise-card').forEach(card => {
                card.classList.remove('active');
            });
            document.querySelector(`[data-category="${category}"]`).classList.add('active');
            
            // Handle random category
            if (category === 'random') {
                const categories = Object.keys(exercises);
                const randomCategory = categories[Math.floor(Math.random() * categories.length)];
                currentCategory = randomCategory;
                currentExercise = Math.floor(Math.random() * exercises[randomCategory].length);
            }
            
            updateExerciseDisplay();
            updateProgress();
        }

        function updateExerciseDisplay() {
            const exercise = exercises[currentCategory][currentExercise];
            phraseDisplay.textContent = exercise.phrase;
            pronunciationGuide.textContent = exercise.pronunciation;
            tipsContent.textContent = exercise.tip;
            tipsSection.style.display = 'none';
            feedback.classList.add('hidden');
        }

        function updateProgress() {
            const totalInCategory = exercises[currentCategory].length;
            const progress = ((currentExercise + 1) / totalInCategory) * 100;
            exerciseProgress.style.width = progress + '%';
        }

        function playCurrentPhrase() {
            const exercise = exercises[currentCategory][currentExercise];
            const utterance = new SpeechSynthesisUtterance(exercise.phrase);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            synthesis.speak(utterance);
        }

        function playCurrentPhraseSlow() {
            const exercise = exercises[currentCategory][currentExercise];
            const utterance = new SpeechSynthesisUtterance(exercise.phrase);
            utterance.rate = 0.6;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            synthesis.speak(utterance);
        }

        function showHint() {
            tipsSection.style.display = tipsSection.style.display === 'none' ? 'block' : 'none';
        }

        function toggleRecording() {
            if (!recognition) {
                showFeedback('Speech recognition is not supported in this browser.', 'error');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function evaluateSpeech(transcript) {
            const exercise = exercises[currentCategory][currentExercise];
            const similarity = calculateSimilarity(transcript.toLowerCase(), exercise.phrase.toLowerCase());
            
            let score = Math.round(similarity * 100);
            let feedbackMessage = '';
            let feedbackClass = '';
            
            if (score >= 80) {
                feedbackMessage = `Excellent! (${score}%) Great pronunciation!`;
                feedbackClass = 'success';
                userStats.streak++;
                userStats.experience += 10;
            } else if (score >= 60) {
                feedbackMessage = `Good job! (${score}%) Keep practicing!`;
                feedbackClass = 'info';
                userStats.streak++;
                userStats.experience += 5;
            } else {
                feedbackMessage = `Keep trying! (${score}%) You said: "${transcript}"`;
                feedbackClass = 'error';
                userStats.streak = 0;
                userStats.experience += 1;
            }
            
            showFeedback(feedbackMessage, feedbackClass);
            updateUserStats();
            saveUserStats();
        }

        function calculateSimilarity(str1, str2) {
            const words1 = str1.split(' ');
            const words2 = str2.split(' ');
            let matches = 0;
            
            for (let word1 of words1) {
                for (let word2 of words2) {
                    if (word1 === word2 || levenshteinDistance(word1, word2) <= 2) {
                        matches++;
                        break;
                    }
                }
            }
            
            return matches / Math.max(words1.length, words2.length);
        }

        function levenshteinDistance(str1, str2) {
            const matrix = [];
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            return matrix[str2.length][str1.length];
        }

        function showFeedback(message, type) {
            feedback.textContent = message;
            feedback.className = `feedback ${type}`;
            feedback.classList.remove('hidden');
        }

        function nextExercise() {
            userStats.totalExercises++;
            
            if (currentExercise < exercises[currentCategory].length - 1) {
                currentExercise++;
            } else {
                currentExercise = 0;
                // Move to next category or loop back
                const categories = Object.keys(exercises);
                const currentIndex = categories.indexOf(currentCategory);
                const nextIndex = (currentIndex + 1) % categories.length;
                currentCategory = categories[nextIndex];
                
                // Update active card
                document.querySelectorAll('.exercise-card').forEach(card => {
                    card.classList.remove('active');
                });
                document.querySelector(`[data-category="${currentCategory}"]`).classList.add('active');
            }
            
            updateExerciseDisplay();
            updateProgress();
            updateUserStats();
            saveUserStats();
        }

        function repeatExercise() {
            updateExerciseDisplay();
            playCurrentPhrase();
        }

        function skipExercise() {
            nextExercise();
        }

        function updateUserStats() {
            // Update level based on experience
            const expPerLevel = 100;
            const newLevel = Math.floor(userStats.experience / expPerLevel) + 1;
            
            if (newLevel > userStats.level) {
                userStats.level = newLevel;
                showLevelUp();
            }
            
            // Update UI
            totalExercises.textContent = userStats.totalExercises;
            avgScore.textContent = userStats.avgScore;
            streak.textContent = userStats.streak;
            
            // Update level indicator
            const levelProgress = (userStats.experience % expPerLevel) / expPerLevel * 100;
            document.getElementById('levelProgress').style.width = levelProgress + '%';
            
            let levelName = 'Beginner';
            if (userStats.level >= 10) levelName = 'Expert';
            else if (userStats.level >= 5) levelName = 'Advanced';
            else if (userStats.level >= 3) levelName = 'Intermediate';
            
            currentLevel.textContent = `${levelName} Level ${userStats.level}`;
        }

        function showLevelUp() {
            const popup = document.createElement('div');
            popup.className = 'achievement-popup';
            popup.innerHTML = `
                <div class="achievement-icon">🎉</div>
                <h3>Level Up!</h3>
                <p>You've reached Level ${userStats.level}!</p>
                <button class="btn btn-primary" onclick="this.parentElement.remove()">Continue</button>
            `;
            
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.onclick = () => {
                popup.remove();
                overlay.remove();
            };
            
            document.body.appendChild(overlay);
            document.body.appendChild(popup);
            
            setTimeout(() => {
                popup.remove();
                overlay.remove();
            }, 3000);
        }

        function loadUserStats() {
            const saved = localStorage.getItem('englishAppStats');
            if (saved) {
                userStats = JSON.parse(saved);
            }
        }

        function saveUserStats() {
            localStorage.setItem('englishAppStats', JSON.stringify(userStats));
        }

        function switchTab(tab) {
            // Update active nav item
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            // Simple tab switching for demo
            if (tab === 'progress') {
                showFeedback('Progress tracking feature coming soon!', 'info');
            } else if (tab === 'settings') {
                showFeedback('Settings feature coming soon!', 'info');
            }
        }

        function updateUI() {
            updateExerciseDisplay();
            updateProgress();
            updateUserStats();
        }

        // Auto-play first phrase when page loads
        setTimeout(() => {
            if (exercises[currentCategory] && exercises[currentCategory].length > 0) {
                playCurrentPhrase();
            }
        }, 1000);
    </script>
</body>
</html>
